@if (loading()) {
  <app-dashboard-skeleton />
} @else {
  <!-- KPI Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
    <app-kpi-card
      [label]="'Total Actual hours'"
      [icon]="'fa-solid fa-clock fa-sm'"
      [value]="projectsHours()?.totalHours ?? 0"
    ></app-kpi-card>

    <app-kpi-card
      [label]="'Users with Hours'"
      [icon]="'fa-solid fa-user-check fa-sm'"
      [value]="azureUsersKpis().usersWithHours"
    ></app-kpi-card>

    <app-kpi-card
      [label]="'Inactive Users'"
      [icon]="'fa-solid fa-user-slash fa-sm'"
      [value]="azureUsersKpis().inActiveUsers"
    ></app-kpi-card>

    <app-kpi-card
      [label]="'Total Users'"
      [icon]="'fa-solid fa-users fa-sm'"
      [value]="azureUsersKpis().totalUsers"
    ></app-kpi-card>

    <app-kpi-card
      [label]="'Projects Scanned'"
      [icon]="'fa-solid fa-check-circle fa-sm'"
      [value]="projectsHours()?.projectsCount ?? 0"
    ></app-kpi-card>
  </div>

  
  <div class="flex flex-col md:flex-row gap-4 mt-4">
    <!-- Top Contributors -->
    <div
      class="card md:w-2/3"
      echarts
      [options]="topContributorsOptions()"
      style="height: 550px"
      [initOpts]="{ renderer: 'svg' }"
    ></div>
    <!-- Projects Workload -->
    <div
      class="card md:w-1/3"
      echarts
      [options]="projectsWorkloadOptions()"
      style="height: 550px"
      [initOpts]="{ renderer: 'svg' }"
    ></div>
  </div>




  <!-- Target Achievement -->
  <div class="flex flex-col md:flex-row gap-4 mt-4">
    <div class="card md:w-1/3">
      <div
        echarts
        [options]="targetHoursOptions()"
        style="height: 550px"
        [initOpts]="{ renderer: 'svg' }"
      ></div>
      <hr class="bg-(--charcoal-600)" />
      <div class="flex items-stretch gap-3 px-4 py-3">
        <div class="min-w-0 flex-1">
          <div class="flex w-full items-center justify-between gap-6 text-sm italic text-gray-500">
            <span class="whitespace-nowrap">Working days</span>
            <span
              class="shrink-0 whitespace-nowrap text-base font-semibold not-italic text-gray-900"
            >
              {{ weekdays }}
            </span>
          </div>
        </div>

        <div class="w-px self-stretch bg-gray-200/90" aria-hidden="true"></div>

        <div class="min-w-0 flex-1">
          <div class="flex w-full items-center justify-between gap-6 text-sm italic text-gray-500">
            <span class="whitespace-nowrap">Active users</span>
            <span
              class="shrink-0 whitespace-nowrap text-base font-semibold not-italic text-gray-900"
            >
              {{ azureUsersKpis().usersWithHours }}
            </span>
          </div>
        </div>
      </div>
    </div>


    <!-- Log Compliance -->
    <div class="card mt-4 w-full">
      <div class="m-2 mb-3 flex flex-col gap-3 md:flex-row md:items-start md:justify-between">
          <h3 class="m-0 text-xl font-bold">Log compliance</h3>
        <button
          type="button"
          class="btn btn-secondary self-start"
          (click)="exportLogComplianceToXlsx()"
        >
          <i class="pi pi-download"></i> Export
        </button>
      </div>
      <div
        class="h-[440px] w-full"
        echarts
        [options]="logComplianceOptions()"
        [initOpts]="{ renderer: 'svg' }"
      ></div>
    </div>
  </div>
}
