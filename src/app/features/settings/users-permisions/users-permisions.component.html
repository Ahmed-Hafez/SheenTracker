<div class="flex justify-between">
  <div class="flex flex-col mb-4 px-3">
    <h1 class="text-xl font-bold mb-0">Users & Permissions</h1>
    <p class="text-sm text-gray-500">Manage users and their permissions here.</p>
  </div>

  <div class="flex gap-2 mb-4 px-3" [formGroup]="usersFilterForm">
    <div class="flex flex-col gap-3 w-full col-span-1 md:col-span-4 lg:col-span-2">
      <div class="search-field">
        <input
          type="text"
          placeholder="Search by name or email…"
          class="field"
          formControlName="searchTerm"
        />
      </div>
    </div>
    <button
      type="button"
      class="btn btn-primary whitespace-nowrap w-full md:w-auto shrink-0"
      (click)="showAddPopup()"
    >
      <i class="pi pi-plus"></i> Add User
    </button>
  </div>
</div>

<p-table
  [value]="users()"
  [paginator]="true"
  [rows]="10"
  [loading]="isLoading()"
  [tableStyle]="{
    'min-width': '50rem',
    'border-radius': '8px 8px 0 0',
    border: '1px solid #ebe9e7',
    'border-bottom': 'none',
    'box-shadow': '0px 4px 4px rgba(0, 0, 0, 1)',
  }"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} records"
  [rowsPerPageOptions]="[5, 10, 20]"
  [sortOrder]="-1"
>
  <ng-template #header>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Title</th>
      <th>Role</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-user>
    <tr>
      <td>{{ user.firstName }} {{ user.lastName }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.title }}</td>
      <td>{{ user.role }}</td>
      <td>
        <p-tag
          [value]="user.isActive ? 'Active' : 'Inactive'"
          [severity]="user.isActive ? 'success' : 'secondary'"
        />
      </td>
      <td>
        <div class="flex items-center gap-2">
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            title="Edit"
            (click)="showEditPopup(user)"
          >
            <i class="pi pi-pencil"></i>
          </button>
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            title="Delete"
            (click)="showDeletePopup(user)"
          >
            <i class="pi pi-trash"></i>
          </button>
          @if (user.isActive) {
            <button
              type="button"
              class="btn btn-secondary btn-sm"
              title="Deactivate"
              (click)="deactivateUser(user)"
            >
              <i class="pi pi-ban"></i>
            </button>
          } @else {
            <button
              type="button"
              class="btn btn-secondary btn-sm"
              title="Activate"
              (click)="activateUser(user)"
            >
              <i class="pi pi-check"></i>
            </button>
          }
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5">
        <div class="flex md:justify-center items-center p-10">
          <p class="block mono-metric" style="font-weight: 400">
            No users match the current filters.
          </p>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>

@if (userDialogVisible()) {
  <app-auth-user-form-dialog
    (outputVisibleSignal)="onDialogVisibleChange($event)"
    [inputVisibleSignal]="userDialogVisible()"
    [isEditMode]="isEditMode()"
    [userData]="selectedUser()"
  />
}

<app-delete-popup
  [title]="selectedUser() ? getUserDisplayName(selectedUser()!) : 'User'"
  [description]="'Are you sure you want to delete this user?'"
  [action]="deleteUser(selectedUser()?.id ?? 0)"
  [inputVisibleSignal]="deleteRequestVisible()"
  (outputVisibleSignal)="closeDeletePopup($event)"
/>
