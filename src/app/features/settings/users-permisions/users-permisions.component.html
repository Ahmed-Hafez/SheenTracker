<div class="flex justify-between">
  <div class="flex flex-col mb-4 px-3">
    <h1 class="text-xl font-bold mb-0">Users & Permissions</h1>
    <p class="text-sm text-gray-500">Manage users and their permissions here.</p>
  </div>

  <div class="flex gap-2 mb-4 px-3">
    <div class="flex flex-col gap-3 w-full col-span-1 md:col-span-4 lg:col-span-2">
      <div class="search-field">
        <input
          type="text"
          placeholder="Search by name or email…"
          class="field"
          formControlName="searchTerm"
        />
      </div>
    </div>
    <button type="button" class="btn btn-primary whitespace-nowrap w-full md:w-auto shrink-0">
      <i class="pi pi-plus"></i> Add User
    </button>
  </div>
</div>

<p-table
  [value]="products"
  [paginator]="true"
  [rows]="10"
  [tableStyle]="{
    'min-width': '50rem',
    'border-radius': '8px 8px 0 0',
    border: '1px solid #ebe9e7',
    'border-bottom': 'none',
    'box-shadow': '0px 4px 4px rgba(0, 0, 0, 1)',
  }"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} records"
  [rowsPerPageOptions]="[5, 10, 20]"
  [sortOrder]="-1"
>
  <ng-template #header>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Title</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </ng-template>
</p-table>
