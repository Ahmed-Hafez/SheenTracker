<div class="flex flex-col gap-6">
  <div class="flex flex-row justify-between items-end gap-4">
    <div class="space-y-3">
      <p-skeleton width="18rem" height="1.75rem" />
      <p-skeleton width="8rem" height="1rem" />
    </div>

    <div class="flex items-center gap-2">
      <p-skeleton width="5.5rem" height="2.5rem" borderRadius="0.5rem" />
      <p-skeleton width="5.5rem" height="2.5rem" borderRadius="0.5rem" />
    </div>
  </div>

  <div
    class="grid gap-4 rounded-xl border border-[#ebe9e7] bg-white p-5 shadow-sm md:grid-cols-[220px_1fr]"
  >
    <div class="flex items-center gap-4">
      <p-skeleton shape="circle" size="4rem" />
      <div class="flex flex-col gap-2">
        <p-skeleton width="10rem" height="1.25rem" />
        <p-skeleton width="8rem" height="0.9rem" />
      </div>
    </div>

    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      @for (item of [1, 2, 3, 4, 5, 6]; track item) {
        <div class="rounded-lg border border-[#ebe9e7] p-4">
          <p-skeleton width="35%" height="0.85rem" class="mb-3" />
          <p-skeleton width="70%" height="1.15rem" />
        </div>
      }
    </div>
  </div>

  <div class="rounded-xl border border-[#ebe9e7] bg-white p-5 shadow-sm">
    <div class="mb-4 flex items-center justify-between gap-3">
      <p-skeleton width="10rem" height="1.25rem" />
      <p-skeleton width="9rem" height="2.5rem" borderRadius="0.5rem" />
    </div>

    <div class="space-y-3">
      @for (row of [1, 2, 3, 4, 5, 6]; track row) {
        <div class="grid grid-cols-4 gap-4 rounded-lg border border-[#f0ece7] p-3">
          @for (cell of [1, 2, 3, 4]; track cell) {
            <p-skeleton height="1rem" />
          }
        </div>
      }
    </div>
  </div>
</div>
