<p-dialog
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="!$event && onClosePopup()"
  [resizable]="false"
  [draggable]="false"
  [style]="{ width: '28rem', backgroundColor: 'var(--page-bg)' }"
  [breakpoints]="{ '640px': '95vw' }"
  ariaLabelledBy="delete-popup-title"
>
  <ng-template #header>
    <h2 id="delete-popup-title" class="m-0">Delete {{ title() }}?</h2>
  </ng-template>

  <p class="m-0 text-(--charcoal-600)">{{ description() }}</p>

  <ng-template #footer>
    <div class="flex justify-end gap-2">
      <button type="button" class="btn btn-secondary" (click)="onClosePopup()">Keep</button>
      <button
        type="button"
        class="btn btn-danger"
        [disabled]="isDeleteLoading()"
        (click)="onSubmit()"
      >
        @if (isDeleteLoading()) {
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
        }
        Delete
      </button>
    </div>
  </ng-template>
</p-dialog>
