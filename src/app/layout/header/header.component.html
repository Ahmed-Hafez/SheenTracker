<div class="flex w-full flex-wrap items-center justify-between gap-x-4 gap-y-2">
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <button
      id="sidebar-toggle"
      type="button"
      class="btn btn-ghost shrink-0"
      (click)="toggleSidebar()"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="navExpanded()"
      [attr.aria-label]="toggleLabel()"
    >
      <img
        [ngSrc]="navExpanded() ? 'svgs/sidebar-close.svg' : 'svgs/sidebar-open.svg'"
        alt=""
        width="20"
        height="20"
        class="shrink-0"
      />
    </button>

    <span class="h-7 w-px shrink-0 bg-(--charcoal-100)" aria-hidden="true"></span>
    <div class="min-w-0">
      <h1 class="page-title">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="page-subtitle">{{ subtitle() }}</p>
      }
    </div>
  </div>

  <div class="flex items-center gap-2 max-sm:w-full">
    @switch (dateScope()) {
      @case ('quarter') {
        <p-select
          [options]="availableQuarters"
          [(ngModel)]="selectedQuarter"
          (onChange)="onQuarterChange($event.value)"
          placeholder="Select quarter"
          ariaLabel="Quarter"
          optionLabel="quarter"
          optionValue="quarter"
          class="max-sm:flex-1"
          [style]="{ minWidth: '12rem' }"
        >
          <ng-template #item let-quarter>
            <div class="flex flex-col items-start justify-between">
              <span
                class="font-semibold"
                [class.text-white]="isQuarterSelected(quarter.quarter)"
                [class.text-black]="!isQuarterSelected(quarter.quarter)"
                >{{ quarter.quarter }}</span
              >
              <span class="text-caption font-light">{{ formatDate(quarter.dateRange) }}</span>
            </div>
          </ng-template>
        </p-select>
      }
      @case ('range') {
        <label for="shell-date-range" class="sr-only">Date range</label>
        <p-datepicker
          class="min-w-0 max-sm:flex-1 [&_input]:min-w-[15rem] max-sm:[&_input]:min-w-0"
          [ngModel]="rangeDates()"
          (ngModelChange)="onRangeChange($event)"
          selectionMode="range"
          [readonlyInput]="true"
          [showOnFocus]="false"
          [numberOfMonths]="isPhone() ? 1 : 2"
          [variant]="'filled'"
          [showIcon]="true"
          [minDate]="minDate"
          [maxDate]="maxDate"
          [dateFormat]="'dd M yy'"
          inputId="shell-date-range"
          [iconDisplay]="'input'"
        />
      }
    }

    @if (showRefresh()) {
      <span class="refreshed-at max-md:sr-only" aria-live="polite">
        @if (lastRefreshedAt(); as refreshedAt) {
          Refreshed {{ refreshedAt | date: 'HH:mm' }}
        }
      </span>
      <button type="button" class="btn btn-secondary shrink-0" (click)="onRefreshClick()">
        <i class="pi pi-refresh" aria-hidden="true"></i> Refresh
      </button>
    }
  </div>
</div>
