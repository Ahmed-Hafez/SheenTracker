<div class="flex w-full items-center justify-between gap-4">
  <div class="flex min-w-0 items-center">
    <button
      type="button"
      class="btn btn-ghost"
      (click)="toggleCollapse.emit()"
      [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <img
        [src]="isCollapsed() ? 'svgs/sidebar-open.svg' : 'svgs/sidebar-close.svg'"
        alt="Toggle sidebar"
        class="h-5 w-5 shrink-0"
      />
    </button>

    <span class="h-7 w-px shrink-0 bg-(--charcoal-800)" aria-hidden="true"></span>
    <div class="w-5"></div>
    <div class="min-w-0">
      <h3 class="">
        {{ title() || 'Sheen Pulse' }}
      </h3>
      @if (subtitle()) {
        <span class="text-sm text-muted-foreground">
          {{ subtitle() }}
        </span>
      }
    </div>
  </div>

  <div class="flex items-center gap-2">
    @if (isQplanRoute()) {
      <p-select
        [options]="availableQuarters"
        [(ngModel)]="selectedQuarter"
        (onChange)="onQuarterChange($event.value)"
        placeholder="Select Quarter"
        optionLabel="quarter"
        optionValue="quarter"
        [style]="{ minWidth: '12rem' }"
      >
        <ng-template #item let-quarter>
          <div class="flex flex-col items-start justify-between">
            <span
              class="font-semibold text-white"
              [class.text-white]="isQuarterSelected(quarter)"
              [class.text-black]="!isQuarterSelected(quarter)"
              >{{ quarter.quarter }}</span
            >
            <span class="text-sm font-light">{{ formatDate(quarter.dateRange) }}</span>
          </div>
        </ng-template>
      </p-select>
    } @else {
      <p-datepicker
        [ngModel]="rangeDates()"
        (ngModelChange)="onRangeChange($event)"
        selectionMode="range"
        [readonlyInput]="true"
        [numberOfMonths]="2"
        [variant]="'filled'"
        [showIcon]="true"
        [minDate]="minDate"
        [maxDate]="maxDate"
        [dateFormat]="'dd M yy'"
        inputId="icondisplay"
        [iconDisplay]="'input'"
      />
    }
    <button type="button" class="btn btn-secondary" (click)="onRefreshClick()">
      <i class="pi pi-refresh"></i> Refresh
    </button>
  </div>
</div>
