<li>
  @if (menuItem().items; as children) {
    <button
      type="button"
      pRipple
      class="sidebar-link"
      [class.justify-center]="isSidebarCollapsed()"
      [class.active]="isChildRouteActive()"
      [attr.aria-expanded]="isSidebarCollapsed() ? null : isSubmenuOpen()"
      [attr.aria-controls]="isSidebarCollapsed() ? null : submenuId()"
      [pTooltip]="menuItem().label"
      tooltipPosition="right"
      [tooltipDisabled]="!isSidebarCollapsed()"
      (click)="toggleSubmenu()"
    >
      <i class="sidebar-link-icon shrink-0 {{ menuItem().icon }}" aria-hidden="true"></i>
      <span class="min-w-0 truncate" [class.sr-only]="isSidebarCollapsed()">{{
        menuItem().label
      }}</span>
      @if (!isSidebarCollapsed()) {
        <i
          class="pi pi-chevron-down ml-auto transition-transform duration-200"
          [class.rotate-180]="isSubmenuOpen()"
          aria-hidden="true"
        ></i>
      }
    </button>

    @if (isSubmenuOpen() && !isSidebarCollapsed()) {
      <ul [id]="submenuId()" class="ml-10 list-none border-l border-(--charcoal-800) px-0 py-0">
        @for (subItem of children; track subItem.label) {
          <li>
            <a
              pRipple
              [routerLink]="subItem.routerLink"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              class="sidebar-sublink"
              (click)="onLinkClick()"
            >
              <span class="min-w-0 truncate">{{ subItem.label }}</span>
            </a>
          </li>
        }
      </ul>
    }
  } @else {
    <a
      pRipple
      [routerLink]="menuItem().routerLink"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      class="sidebar-link"
      [class.justify-center]="isSidebarCollapsed()"
      [pTooltip]="menuItem().label"
      tooltipPosition="right"
      [tooltipDisabled]="!isSidebarCollapsed()"
      (click)="onLinkClick()"
    >
      <i class="sidebar-link-icon shrink-0 {{ menuItem().icon }}" aria-hidden="true"></i>
      <span class="min-w-0 truncate" [class.sr-only]="isSidebarCollapsed()">{{
        menuItem().label
      }}</span>
    </a>
  }
</li>
