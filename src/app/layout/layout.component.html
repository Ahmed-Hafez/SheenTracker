<div class="main-container min-h-screen bg-page">
  <header
    class="topbar"
    [style.left.px]="hideSidebar() ? 0 : mainOffsetPx()"
    [style.width]="hideSidebar() ? '100%' : 'calc(100% - ' + mainOffsetPx() + 'px)'"
    [attr.inert]="isOverlayOpen() ? '' : null"
  >
    <app-header
      class="w-full"
      [title]="pageTitle()"
      [subtitle]="pageSubtitle()"
      [dateScope]="dateScope()"
      [showRefresh]="showRefresh()"
    ></app-header>
  </header>

  @if (isOverlayOpen()) {
    <button
      type="button"
      tabindex="-1"
      class="sidebar-scrim"
      (click)="closeOverlay()"
      aria-label="Close navigation"
    ></button>
  }
  @if (!hideSidebar()) {
    <aside
      #aside
      id="app-sidebar"
      class="sidebar layout-sidebar-motion"
      [style.width.px]="sidebarWidthPx()"
      [class.-translate-x-full]="sidebarHidden()"
      [attr.inert]="sidebarHidden() ? '' : null"
      aria-label="Sidebar"
    >
      <app-side-bar></app-side-bar>
    </aside>
  }

  <main
    class="content-wrapper"
    [style.marginLeft.px]="hideSidebar() ? 0 : mainOffsetPx()"
    [style.width]="hideSidebar() ? '100%' : 'calc(100% - ' + mainOffsetPx() + 'px)'"
    [attr.inert]="isOverlayOpen() ? '' : null"
  >
    <div class="content-inner">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
